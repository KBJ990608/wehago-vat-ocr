name: Build Windows Electron App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  make-windows:
    runs-on: windows-latest
    env:
      LAW_API_OC: tax_low
      KSKILL_PROXY_BASE_URL: https://k-skill-proxy.nomadamas.org
      APP_ENABLE_LOGIN: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make Windows installer
        run: npm run electron:make:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WEHAGO-VAT-OCR-Windows
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
